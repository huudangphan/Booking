name: CI/CD Docker Compose Deploy

on:
  push:
    branches:
      - dev
      - staging
      - test
      - main   # production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Map branch name to environment (must match your GitHub Environments)
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug SSH key presence
        run: |
          echo "${{ secrets.SSH_KEY }}" > id_rsa
          chmod 600 id_rsa
          echo "SSH key written to id_rsa file."
          ls -l id_rsa
          file id_rsa
          ssh-keygen -lf id_rsa || echo "Invalid key format"

      - name: Test SSH connection
        run: |
          ssh -i id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful.'"

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "~/BookingApp"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/src
            docker-compose -f docker-compose.yml -f docker-compose.override.yml down
            docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d --build
